name: Coverage
on:
  push:
    branches:
      - "*"
env:
  RUST_BACKTRACE: 1
jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          # wasm-bindgen-test's minicov dependency does not yet support LLVM 23.
          - nightly-2026-08-03
        target:
          - x86_64-unknown-linux-gnu
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
      - name: install wasm coverage test dependencies
        run: |
          rustup +${{ matrix.version }} target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: coverage
        run: cargo run --release -- tarpaulin --engine llvm --follow-exec --post-test-delay 10 --coveralls ${{ secrets.COVERALLS_TOKEN }} 
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.version }}
